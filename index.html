<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>
    <div id="container">
      <div id="row1">
        <div id="display"></div>
      </div>
      <div id="row2">
        <button class="light-grey-button">CE</button>
        <button id="clear">C</button>
        
      </div>
      <div id="row3">
        <button class="grey-button">7</button>
        <button class="grey-button">8</button>
        <button class="grey-button">9</button>
        <button id="minus">-</button>
      </div>
      <div id="row4">
        <button class="grey-button">4</button>
        <button class="grey-button">5</button>
        <button class="grey-button">6</button>
        <button id="divide">/</button>
      </div>
      <div id="row5">
        <button class="grey-button">1</button>
        <button class="grey-button">2</button>
        <button class="grey-button">3</button>
        <button id="multiply">*</button>
      </div>
      <div id="row6">
        <button class="grey-button">.</button>
        <button class="grey-button">0</button>
        <button class="light-grey-button">=</button>
        <button id="plus">+</button>
      </div>
    </div>
  </body>
</html>
