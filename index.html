<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>
    <div id="container">
      <div id="row1">
        <div id="display">0</div>
      </div>
      <div id="row2">
        <button class="light-grey-button" id="backspace"><-</button>
        <button class="light-grey-button" id="clear-entry">CE</button>
        <button id="clear">C</button>
      </div>
      <div id="row3">
        <button class="grey-button" id="7">7</button>
        <button class="grey-button" id="8">8</button>
        <button class="grey-button" id="9">9</button>
        <button id="minus">-</button>
      </div>
      <div id="row4">
        <button class="grey-button" id="4">4</button>
        <button class="grey-button" id="5">5</button>
        <button class="grey-button" id="6">6</button>
        <button id="divide">/</button>
      </div>
      <div id="row5">
        <button class="grey-button" id="1">1</button>
        <button class="grey-button" id="2">2</button>
        <button class="grey-button" id="3">3</button>
        <button id="multiply">*</button>
      </div>
      <div id="row6">
        <button class="grey-button" id="decimal-point">.</button>
        <button class="grey-button" id="0">0</button>
        <button class="light-grey-button" id="equal">=</button>
        <button id="plus">+</button>
      </div>
    </div>
  </body>
</html>
